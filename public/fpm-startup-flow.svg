<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 200" font-family="'Trebuchet MS', 'Nunito', sans-serif">
  <defs>
    <marker id="arrow-fpm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <!-- A: Démarrage du master -->
  <g>
    <rect x="15" y="55" width="190" height="90" rx="14" fill="#eef2f8" stroke="#1a4fa0" stroke-width="2.5"/>
    <text x="110" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1a4fa0">Démarrage</text>
    <text x="110" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#1a4fa0">du master</text>
  </g>
  <line x1="205" y1="100" x2="237" y2="100" stroke="#888888" stroke-width="2.5" marker-end="url(#arrow-fpm)"/>

  <!-- B: Spawn des workers -->
  <g>
    <rect x="240" y="55" width="210" height="90" rx="14" fill="#eef2f8" stroke="#1a4fa0" stroke-width="2.5"/>
    <text x="345" y="95" text-anchor="middle" font-size="15" font-weight="700" fill="#1a4fa0">Spawn des workers</text>
    <text x="345" y="117" text-anchor="middle" font-size="12.5" fill="#1a4fa0" opacity="0.85">(static / dynamic)</text>
  </g>
  <line x1="450" y1="100" x2="482" y2="100" stroke="#888888" stroke-width="2.5" marker-end="url(#arrow-fpm)"/>

  <!-- C: Réception des requêtes FastCGI de Nginx -->
  <g>
    <rect x="485" y="55" width="250" height="90" rx="14" fill="#eef4ec" stroke="#1a7a4a" stroke-width="2.5"/>
    <text x="610" y="95" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a7a4a">Réception des requêtes</text>
    <text x="610" y="117" text-anchor="middle" font-size="13" fill="#1a7a4a" opacity="0.9">FastCGI de Nginx</text>
  </g>
  <line x1="735" y1="100" x2="768" y2="100" stroke="#888888" stroke-width="2.5" marker-end="url(#arrow-fpm)"/>

  <!-- D: Dispatch vers un worker libre (decision) -->
  <g>
    <polygon points="902,35 1032,100 902,165 772,100" fill="#f5f5f0" stroke="#4a4a4a" stroke-width="2.5"/>
    <text x="902" y="95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a3a3a">Dispatch vers</text>
    <text x="902" y="115" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a3a3a">un worker libre</text>
  </g>
</svg>
