<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Trebuchet MS', 'Nunito', sans-serif">
  <defs>
    <marker id="arrow-static" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a4fa0"/>
    </marker>
  </defs>

  <!-- Step 1: source config -->
  <g>
    <rect x="20" y="170" width="190" height="120" rx="12" fill="#fafaf8" stroke="#1a4fa0" stroke-width="2.5"/>
    <text x="115" y="210" text-anchor="middle" font-size="17" font-weight="700" fill="#1a4fa0">config.m4</text>
    <text x="115" y="238" text-anchor="middle" font-size="14" fill="#1c1c1c">--enable-fibonacci</text>
    <text x="115" y="260" text-anchor="middle" font-size="13" fill="#1c1c1c" opacity="0.75">lors du build de PHP</text>
  </g>

  <line x1="215" y1="230" x2="288" y2="230" stroke="#1a4fa0" stroke-width="2.5" marker-end="url(#arrow-static)"/>

  <!-- Step 2: single compiled binary -->
  <g>
    <rect x="295" y="90" width="300" height="300" rx="16" fill="#fafaf8" stroke="#1c1c1c" stroke-width="3"/>
    <text x="445" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1c1c">binaire php</text>

    <rect x="330" y="160" width="230" height="90" rx="10" fill="#eef4ec" stroke="#1a7a4a" stroke-width="2.5"/>
    <text x="445" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#1a7a4a">ext fibonacci</text>
    <text x="445" y="214" text-anchor="middle" font-size="12.5" fill="#1c1c1c" opacity="0.8">compilée dans le binaire</text>

    <rect x="330" y="265" width="230" height="90" rx="10" fill="#eef2f8" stroke="#1a4fa0" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="445" y="297" text-anchor="middle" font-size="14" fill="#1a4fa0" font-weight="700">standard, date, SPL...</text>
    <text x="445" y="318" text-anchor="middle" font-size="12.5" fill="#1c1c1c" opacity="0.8">autres extensions natives</text>
  </g>

  <line x1="600" y1="230" x2="672" y2="230" stroke="#1a4fa0" stroke-width="2.5" marker-end="url(#arrow-static)"/>

  <!-- Step 3: result -->
  <g>
    <rect x="680" y="150" width="105" height="160" rx="12" fill="#fdf3f0" stroke="#c0392b" stroke-width="2.5"/>
    <text x="732" y="185" text-anchor="middle" font-size="14" fill="#c0392b" font-weight="700">php -m</text>
    <line x1="695" y1="200" x2="770" y2="200" stroke="#c0392b" stroke-width="1.5" opacity="0.4"/>
    <text x="732" y="222" text-anchor="middle" font-size="12.5" fill="#1c1c1c">fibonacci</text>
    <text x="732" y="240" text-anchor="middle" font-size="18" fill="#1a7a4a" font-weight="700">✓</text>
    <text x="732" y="270" text-anchor="middle" font-size="11" fill="#1c1c1c" opacity="0.7">toujours</text>
    <text x="732" y="285" text-anchor="middle" font-size="11" fill="#1c1c1c" opacity="0.7">présente</text>
  </g>
</svg>
