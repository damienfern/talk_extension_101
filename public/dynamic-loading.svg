<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'Trebuchet MS', 'Nunito', sans-serif">
  <defs>
    <marker id="arrow-dyn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a4fa0"/>
    </marker>
    <marker id="arrow-dyn-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Binary php (core only) -->
  <g>
    <rect x="40" y="120" width="230" height="220" rx="16" fill="#fafaf8" stroke="#1c1c1c" stroke-width="3"/>
    <text x="155" y="158" text-anchor="middle" font-size="20" font-weight="700" fill="#1c1c1c">binaire php</text>

    <rect x="65" y="185" width="180" height="70" rx="10" fill="#eef2f8" stroke="#1a4fa0" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="155" y="215" text-anchor="middle" font-size="13.5" fill="#1a4fa0" font-weight="700">standard, date, SPL...</text>
    <text x="155" y="233" text-anchor="middle" font-size="12" fill="#1c1c1c" opacity="0.8">extensions natives</text>

    <text x="155" y="300" text-anchor="middle" font-size="13" fill="#1c1c1c" opacity="0.75">fibonacci n'est pas</text>
    <text x="155" y="318" text-anchor="middle" font-size="13" fill="#1c1c1c" opacity="0.75">incluse dans le binaire</text>
  </g>

  <!-- fibonacci.so separate file -->
  <g>
    <rect x="530" y="150" width="230" height="130" rx="14" fill="#eef4ec" stroke="#1a7a4a" stroke-width="2.5"/>
    <text x="645" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#1a7a4a">fibonacci.so</text>
    <text x="645" y="212" text-anchor="middle" font-size="12.5" fill="#1c1c1c" opacity="0.8">(.dll sous Windows)</text>
    <text x="645" y="238" text-anchor="middle" font-size="12" fill="#1c1c1c" opacity="0.8">produit par phpize + make</text>
    <text x="645" y="256" text-anchor="middle" font-size="12" fill="#1c1c1c" opacity="0.8">module séparé, hors binaire</text>
  </g>

  <!-- dlopen box -->
  <line x1="272" y1="215" x2="336" y2="215" stroke="#1a4fa0" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-dyn)"/>
  <rect x="340" y="182" width="120" height="66" rx="10" fill="#eef2f8" stroke="#1a4fa0" stroke-width="2.5"/>
  <text x="400" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#1a4fa0" font-family="monospace">dlopen()</text>
  <text x="400" y="230" text-anchor="middle" font-size="11" fill="#1c1c1c" opacity="0.75">au démarrage</text>
  <line x1="464" y1="215" x2="524" y2="215" stroke="#1a4fa0" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-dyn)"/>

  <!-- php.ini trigger -->
  <g>
    <rect x="70" y="370" width="290" height="90" rx="12" fill="#fdf9ee" stroke="#c0392b" stroke-width="2.5"/>
    <text x="215" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">php.ini</text>
    <text x="215" y="422" text-anchor="middle" font-size="13" fill="#1c1c1c" font-family="monospace">extension=fibonacci</text>
    <text x="215" y="444" text-anchor="middle" font-size="11.5" fill="#1c1c1c" opacity="0.75">ou -d extension=fibonacci</text>
  </g>

  <path d="M215,370 C215,290 400,320 400,250" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-dyn-red)"/>
  <text x="490" y="345" text-anchor="middle" font-size="12.5" fill="#c0392b" font-style="italic">déclenche le chargement</text>
</svg>
